# Subir tudo do zero:   docker compose up --build
# Pré-requisito: criar os dois arquivos de senha (veja o README).
services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: pavimentai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pavimentai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env da raiz}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_pavimentai:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pavimentai"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Roda uma vez e termina: cria as tabelas, aplica as migrações (v2...v12) e ajusta os usuários.
  # Pode rodar de novo a qualquer momento sem estragar nada.
  migracoes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pavimentai_migracoes
    command: ["python", "scripts/inicializar_banco.py"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./api/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pavimentai_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migracoes:
        condition: service_completed_successfully
    env_file:
      - ./api/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - uploads_pavimentai:/workspace/api/uploads
      # O best.pt não vai para o Git (*.pt no .gitignore): coloque em ml/models/yolo11n/best.pt
      - ./ml/models:/workspace/ml/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/saude', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata_pavimentai:
  uploads_pavimentai:
